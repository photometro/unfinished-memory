<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">首页三张记忆卡片 · 紧凑居中</title>
  <desc id="desc">三张沿用首页底色的纯色记忆卡片，保持上下错位不变，只增加左右分离度和轻微旋转，整体视觉重心居中。</desc>
  <defs>
    <filter id="shadow-back" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#536B74" flood-opacity=".12"/>
    </filter>
    <filter id="shadow-mid" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#536B74" flood-opacity=".14"/>
    </filter>
    <filter id="shadow-front" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#536B74" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="#E2E8EA"/>
  <g transform="rotate(-8 107 108)" filter="url(#shadow-back)">
    <rect x="43" y="47" width="128" height="122" rx="22" fill="#D0D9DD"/>
  </g>
  <g transform="rotate(5 125 128)" filter="url(#shadow-mid)">
    <rect x="57" y="64" width="136" height="128" rx="22" fill="#E0E7E9"/>
  </g>
  <g transform="rotate(-2.5 146 147)" filter="url(#shadow-front)">
    <rect x="75" y="80" width="142" height="134" rx="23" fill="#F1EBE3"/>
  </g>
</svg>
