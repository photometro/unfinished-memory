spring:
  application:
    name: unfinished-server
  datasource:
    url: ${UNFINISHED_DB_URL:jdbc:postgresql://localhost:5432/unfinished}
    username: ${UNFINISHED_DB_USER:unfinished}
    password: ${UNFINISHED_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
