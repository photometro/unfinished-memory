services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: unfinished
      POSTGRES_USER: unfinished
      POSTGRES_PASSWORD: ${UNFINISHED_DB_PASSWORD:-change-me-in-env}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build: ../server
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/unfinished
      SPRING_DATASOURCE_USERNAME: unfinished
      SPRING_DATASOURCE_PASSWORD: ${UNFINISHED_DB_PASSWORD:-change-me-in-env}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres-data:
