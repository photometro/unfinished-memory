plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.unfinished.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.unfinished.app'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    implementation 'androidx.activity:activity-compose:' + rootProject.ext.activityComposeVersion
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:' + rootProject.ext.lifecycleVersion
    implementation 'androidx.core:core-ktx:' + rootProject.ext.coreKtxVersion
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    kapt 'androidx.room:room-compiler:2.7.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}

kapt {
    correctErrorTypes = true
}
